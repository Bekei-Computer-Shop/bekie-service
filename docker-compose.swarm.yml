version: '3.9'

services:
  app:
    image: bekie-service:latest
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost
      LOG_CHANNEL: stderr
      LOG_STACK: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-bekie}
      DB_USERNAME: ${DB_USERNAME:-bekie}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: "true"
      FILESYSTEM_DISK: local
    secrets:
      - db_password
    entrypoint: >
      sh -c "export DB_PASSWORD=$$(cat /run/secrets/db_password) && exec /usr/local/bin/entrypoint.sh"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        failure_action: rollback
        order: start-first
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
      placement:
        constraints:
          - node.role == manager
    networks:
      - appnet

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bekie}
      POSTGRES_USER: ${DB_USERNAME:-bekie}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bekie} -d ${DB_DATABASE:-bekie}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      placement:
        constraints:
          - node.labels.db-node == true
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - appnet

networks:
  appnet:
    driver: overlay

volumes:
  db-data:

secrets:
  db_password:
    external: true

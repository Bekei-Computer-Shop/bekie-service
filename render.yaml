services:
  - type: psql
    name: bekie-db
    plan: starter
    region: oregon
    databaseName: bekie
    user: bekie_user

  - type: redis
    name: bekie-redis
    plan: starter
    region: oregon

  - type: web
    name: bekie-service
    runtime: docker
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: "php artisan migrate --force"
    dockerfilePath: ./Dockerfile
    startCommand: >
      php artisan migrate --force &&
      php artisan optimize:clear &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache &&
      php-fpm -F
    envVars:
      - key: APP_NAME
        value: Bekie Service
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: APP_KEY # Generate a key with `php artisan key:generate --show` and paste it here
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STACK
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_HOST
          propertyName: host
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_PORT
          propertyName: port
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_DATABASE
          propertyName: database
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_USERNAME
          propertyName: user
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_PASSWORD
          propertyName: password
      - fromService:
          type: redis
          name: bekie-redis
          envVarKey: REDIS_URL
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: FILESYSTEM_DISK
        value: local
      - key: FILESYSTEM_PUBLIC_ROOT
        value: /var/www/html/storage/app/public
      - key: FILESYSTEM_ROOT
        value: /var/www/html/storage/app/private
    disk:
      name: bekie-storage
      mountPath: /var/www/html/storage
      sizeGB: 1

  - type: worker
    name: bekie-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    startCommand: "php artisan queue:work redis --tries=3 --timeout=90 --max-time=3600 --memory=128"
    envVars:
      - key: APP_NAME
        value: Bekie Service
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: ${RENDER_EXTERNAL_URL}
      - fromService:
          type: web
          name: bekie-service
          envVarKey: APP_KEY
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STACK
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_HOST
          propertyName: host
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_PORT
          propertyName: port
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_DATABASE
          propertyName: database
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_USERNAME
          propertyName: user
      - fromService:
          type: psql
          name: bekie-db
          envVarKey: DB_PASSWORD
          propertyName: password
      - fromService:
          type: redis
          name: bekie-redis
          envVarKey: REDIS_URL
          property: connectionString
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: FILESYSTEM_DISK
        value: local

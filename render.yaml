services:
  - type: web
    name: laravel-app
    runtime: docker

    # Singapore region is a good fit for Cambodia/SEA users.
    region: singapore

    # Use "starter" for production. Free plan omits preDeployCommand.
    plan: starter

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: PORT
        value: "10000"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        sync: false

      - key: APP_KEY
        sync: false

      # PostgreSQL — link to your Render Postgres database in the dashboard.
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_DATABASE
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      # Render Postgres requires SSL.
      - key: DB_SSLMODE
        value: require

      # Redis — link to your Render Key Value Store (Redis) in the dashboard.
      - key: REDIS_CLIENT
        value: phpredis

      - key: REDIS_HOST
        sync: false

      - key: REDIS_PORT
        value: "6379"

      - key: REDIS_PASSWORD
        sync: false

      # Laravel cache / session / queue.
      - key: CACHE_STORE
        value: redis

      - key: SESSION_DRIVER
        value: redis

      - key: QUEUE_CONNECTION
        value: redis

      # Logging — stderr feeds Render's log drain.
      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      # JWT signing key. Generate with: openssl rand -hex 32
      # app/Services/JwtService.php falls back to APP_KEY if unset, but
      # a dedicated secret is recommended for production.
      - key: JWT_SECRET
        sync: false

      # Cloudinary — required by /api/v1/admin/media.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false

      - key: CLOUDINARY_SECURE
        value: "true"

      - key: CLOUDINARY_FOLDER
        value: bekie

      # Scramble — gated in production. Flip SCRAMBLE_ENABLED to "true"
      # in the dashboard when you want to expose /docs/client and
      # /docs/admin (still gated by RestrictedDocsAccess middleware).
      - key: SCRAMBLE_ENABLED
        value: "true"

      - key: API_VERSION
        value: "1.0.0"

      # Filesystem / session / cookie hardening.
      - key: FILESYSTEM_DISK
        value: local

      - key: SESSION_SECURE_COOKIE
        value: "true"

      - key: SESSION_SAME_SITE
        value: lax

      # Swap to a transactional provider (Resend/Postmark/SES) when the
      # first mail-sending feature ships — see DEPLOYMENT.md "Mail".
      - key: MAIL_MAILER
        value: log

      - key: MAIL_FROM_ADDRESS
        sync: false

      - key: MAIL_FROM_NAME
        sync: false

    # Laravel health endpoint.
    healthCheckPath: /up

    # Allow enough time for graceful shutdown.
    maxShutdownDelaySeconds: 60

    # Automatic deployment when the selected branch changes.
    autoDeployTrigger: commit

    # Runs migrations before each deploy. Requires Starter plan or above.
    # On Free, run manually via Render shell: php artisan migrate --force
    preDeployCommand: php artisan migrate --force
    startCommand: >
      php artisan migrate --force &&
      php artisan optimize:clear &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache &&
      php-fpm -F

# Provision the database and Redis in the Render dashboard (or via
# render.yaml infra blocks). The Starter plan is sufficient for both.
# Note: Render's "Key Value Store" (managed Redis) is in preview — verify
# current availability before relying on it.

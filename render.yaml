services:
  - type: web
    name: laravel-app
    runtime: docker

    # Change to your preferred Render region.
    # Singapore is usually a good choice for Cambodia/SEA users.
    region: singapore

    # Use "starter" for production.
    # Change to "free" if you specifically want the Free plan.
    plan: starter

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render provides PORT at runtime.
    envVars:
      - key: PORT
        value: "10000"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        sync: false

      - key: APP_KEY
        sync: false

      # PostgreSQL
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_DATABASE
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      # Redis
      - key: REDIS_CLIENT
        value: phpredis

      - key: REDIS_HOST
        sync: false

      - key: REDIS_PORT
        value: "6379"

      - key: REDIS_PASSWORD
        sync: false

      # Laravel cache/session
      - key: CACHE_STORE
        value: redis

      - key: SESSION_DRIVER
        value: redis

      # Queue
      - key: QUEUE_CONNECTION
        value: redis

      # Logging
      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

    # Laravel health endpoint
    healthCheckPath: /up

    # Allow enough time for graceful shutdown
    maxShutdownDelaySeconds: 60

    # Automatic deployment when the selected branch changes
    autoDeployTrigger: commit

    # IMPORTANT:
    # Pre-deploy commands are available only on eligible paid
    # Render services, so leave this commented if using Free.
    #
    # preDeployCommand: php artisan migrate --force
